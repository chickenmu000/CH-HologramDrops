name: CH-HologramDrops
main: com.ch.hologramdrops.CHHologramDrops
version: 1.0
api-version: '1.21'
description: Shows the item name and amount as a hologram above dropped items (바닥에 떨어진 아이템 위에 이름과 개수를 홀로그램으로 표시)
commands:
  hdreload:
    description: Reload the CH-HologramDrops configuration
    aliases: [hdr, holoreload]
    usage: /hdreload
    permission: chhologramdrops.reload
permissions:
  chhologramdrops.reload:
    description: Allows reloading the configuration
    default: op
